<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow Simulator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(180deg, #0b1a3e 0%, #1a2f6e 40%, #3a5fad 70%, #6b8fd4 100%);
    min-height: 100vh;
    overflow: hidden;
    color: #fff;
  }

  /* --- Editor Panel --- */
  #editor-panel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #editor-panel.hidden {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.9);
    pointer-events: none;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 2px 12px rgba(100,160,255,0.4);
  }
  .subtitle {
    font-size: 14px;
    opacity: 0.6;
    margin-top: -12px;
  }

  /* Canvas wrapper */
  .canvas-wrapper {
    position: relative;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 16px;
    backdrop-filter: blur(8px);
  }
  #draw-canvas {
    display: block;
    border-radius: 12px;
    cursor: crosshair;
    background: rgba(255,255,255,0.03);
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .brush-size-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.08);
    padding: 8px 14px;
    border-radius: 12px;
  }
  .brush-size-group label { font-size: 13px; opacity: 0.7; }
  .brush-size-group input[type="range"] {
    width: 80px;
    accent-color: #7eb8ff;
  }

  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-clear {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-clear:hover { background: rgba(255,255,255,0.18); }

  .btn-snow {
    background: linear-gradient(135deg, #7eb8ff 0%, #c8a2ff 100%);
    color: #0b1a3e;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 14px 40px;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(126,184,255,0.35);
  }
  .btn-snow:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 32px rgba(126,184,255,0.5);
  }
  .btn-snow:active { transform: translateY(0); }

  /* Preset shapes */
  .presets {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .presets span { font-size: 13px; opacity: 0.6; }
  .preset-btn {
    width: 42px; height: 42px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .preset-btn:hover {
    background: rgba(255,255,255,0.14);
    transform: scale(1.08);
  }

  /* Upload PNG button */
  .upload-btn {
    height: 42px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1px dashed rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .upload-btn:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.5);
    transform: scale(1.04);
  }

  /* --- Snow Canvas (fullscreen) --- */
  #snow-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
    pointer-events: none;
  }

  /* Back button during snow */
  #back-btn {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease 1s;
  }
  #back-btn.visible {
    opacity: 1;
    pointer-events: all;
  }

  /* Ground snow accumulation */
  .ground {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 0;
    background: linear-gradient(180deg, rgba(220,230,255,0.0) 0%, rgba(220,230,255,0.15) 100%);
    z-index: 2;
    transition: height 8s ease;
    pointer-events: none;
  }
  .ground.active { height: 60px; }
</style>
</head>
<body>

<!-- Editor -->
<div id="editor-panel">
  <h1>SNOW SIMULATOR</h1>
  <p class="subtitle">Draw your snowflake shape below</p>

  <div class="presets">
    <span>Presets:</span>
    <button class="preset-btn" data-preset="snowflake" title="Snowflake">&#10052;</button>
    <button class="preset-btn" data-preset="heart" title="Heart">&#9829;</button>
    <button class="preset-btn" data-preset="flower" title="Flower">&#10047;</button>
    <button class="preset-btn" data-preset="diamond" title="Diamond">&#9830;</button>
    <input type="file" id="png-upload" accept="image/*" style="display:none">
    <button class="upload-btn" id="png-btn" title="Upload your own image">&#8679; PNG</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="draw-canvas" width="220" height="220"></canvas>
  </div>

  <div class="controls">
    <div class="brush-size-group">
      <label>Brush</label>
      <input type="range" id="brush-size" min="2" max="20" value="6">
    </div>
    <button class="btn btn-clear" id="clear-btn">Clear</button>
  </div>

  <button class="btn btn-snow" id="snow-btn">SNOW NOW</button>
</div>

<!-- Snow layer -->
<canvas id="snow-canvas"></canvas>
<div class="ground" id="ground"></div>

<button class="btn btn-clear" id="back-btn">&#8592; Draw Again</button>

<script>
(() => {
  // --- Drawing Canvas ---
  const drawCanvas = document.getElementById('draw-canvas');
  const drawCtx = drawCanvas.getContext('2d');
  const brushInput = document.getElementById('brush-size');
  let drawing = false;
  let hasDrawn = false;

  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  drawCtx.strokeStyle = '#ffffff';

  function startDraw(e) {
    drawing = true;
    hasDrawn = true;
    drawCtx.lineWidth = brushInput.value;
    const { x, y } = getPos(e);
    drawCtx.beginPath();
    drawCtx.moveTo(x, y);
    // draw a dot for single clicks
    drawCtx.lineTo(x + 0.1, y + 0.1);
    drawCtx.stroke();
  }
  function moveDraw(e) {
    if (!drawing) return;
    const { x, y } = getPos(e);
    drawCtx.lineTo(x, y);
    drawCtx.stroke();
  }
  function stopDraw() { drawing = false; }
  function getPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return {
      x: touch.clientX - rect.left,
      y: touch.clientY - rect.top
    };
  }

  drawCanvas.addEventListener('mousedown', startDraw);
  drawCanvas.addEventListener('mousemove', moveDraw);
  drawCanvas.addEventListener('mouseup', stopDraw);
  drawCanvas.addEventListener('mouseleave', stopDraw);
  drawCanvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); });
  drawCanvas.addEventListener('touchmove', e => { e.preventDefault(); moveDraw(e); });
  drawCanvas.addEventListener('touchend', stopDraw);

  // --- Presets ---
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      drawCtx.clearRect(0, 0, 220, 220);
      const cx = 110, cy = 110;
      drawCtx.lineWidth = 3;
      drawCtx.fillStyle = '#ffffff';
      drawCtx.strokeStyle = '#ffffff';

      const preset = btn.dataset.preset;
      if (preset === 'snowflake') drawSnowflake(cx, cy, 90);
      else if (preset === 'heart') drawHeart(cx, cy, 45);
      else if (preset === 'flower') drawFlower(cx, cy, 45);
      else if (preset === 'diamond') {
        drawCtx.beginPath();
        drawCtx.moveTo(cx, cy - 55);
        drawCtx.lineTo(cx + 40, cy);
        drawCtx.lineTo(cx, cy + 55);
        drawCtx.lineTo(cx - 40, cy);
        drawCtx.closePath();
        drawCtx.fill();
      }
      hasDrawn = true;
    });
  });

  function drawStar(cx, cy, spikes, outerR, innerR) {
    drawCtx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const angle = (Math.PI * i) / spikes - Math.PI / 2;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      i === 0 ? drawCtx.moveTo(x, y) : drawCtx.lineTo(x, y);
    }
    drawCtx.closePath();
    drawCtx.fill();
  }

  function drawHeart(cx, cy, size) {
    drawCtx.beginPath();
    drawCtx.moveTo(cx, cy + size * 0.7);
    drawCtx.bezierCurveTo(cx - size * 1.2, cy - size * 0.2, cx - size * 0.6, cy - size, cx, cy - size * 0.4);
    drawCtx.bezierCurveTo(cx + size * 0.6, cy - size, cx + size * 1.2, cy - size * 0.2, cx, cy + size * 0.7);
    drawCtx.fill();
  }

  function drawSnowflake(cx, cy, radius) {
    drawCtx.lineWidth = 4;
    drawCtx.lineCap = 'round';
    const arms = 6;
    const branchFractions = [0.35, 0.6, 0.8];
    for (let i = 0; i < arms; i++) {
      const angle = (Math.PI * 2 * i) / arms - Math.PI / 2;
      const ax = cx + Math.cos(angle) * radius;
      const ay = cy + Math.sin(angle) * radius;
      // Main arm
      drawCtx.beginPath();
      drawCtx.moveTo(cx, cy);
      drawCtx.lineTo(ax, ay);
      drawCtx.stroke();
      // Branches
      for (const t of branchFractions) {
        const bx = cx + Math.cos(angle) * radius * t;
        const by = cy + Math.sin(angle) * radius * t;
        const bLen = radius * 0.28 * (1 - t * 0.5);
        for (const side of [-1, 1]) {
          const ba = angle + side * Math.PI / 3;
          drawCtx.beginPath();
          drawCtx.moveTo(bx, by);
          drawCtx.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
          drawCtx.stroke();
        }
      }
    }
    // Center dot
    drawCtx.beginPath();
    drawCtx.arc(cx, cy, 5, 0, Math.PI * 2);
    drawCtx.fill();
  }

  function drawFlower(cx, cy, size) {
    const petals = 6;
    for (let i = 0; i < petals; i++) {
      const angle = (Math.PI * 2 * i) / petals;
      drawCtx.save();
      drawCtx.translate(cx, cy);
      drawCtx.rotate(angle);
      drawCtx.beginPath();
      drawCtx.ellipse(size * 0.58, 0, size * 0.52, size * 0.28, 0, 0, Math.PI * 2);
      drawCtx.fill();
      drawCtx.restore();
    }
    // Center
    drawCtx.beginPath();
    drawCtx.arc(cx, cy, size * 0.2, 0, Math.PI * 2);
    drawCtx.fill();
  }

  // --- Clear ---
  document.getElementById('clear-btn').addEventListener('click', () => {
    drawCtx.clearRect(0, 0, 220, 220);
    hasDrawn = false;
  });

  // --- Snow Animation ---
  const snowCanvas = document.getElementById('snow-canvas');
  const ctx = snowCanvas.getContext('2d');
  let snowflakes = [];
  let animId = null;
  let snowing = false;
  let shapeImg = null;

  // --- Accumulation ---
  const accCanvas = document.createElement('canvas');
  let accCtx = null;
  let pileHeight = null; // Float32Array, height in px from bottom per column

  function initAccumulation() {
    accCanvas.width = snowCanvas.width;
    accCanvas.height = snowCanvas.height;
    accCtx = accCanvas.getContext('2d');
    accCtx.clearRect(0, 0, accCanvas.width, accCanvas.height);
    pileHeight = new Float32Array(snowCanvas.width).fill(0);
  }

  function resizeSnow() {
    snowCanvas.width = window.innerWidth;
    snowCanvas.height = window.innerHeight;
    if (snowing) initAccumulation();
  }
  window.addEventListener('resize', resizeSnow);
  resizeSnow();

  // Capture the drawn shape as an image
  function captureShape() {
    // Find bounding box of drawn pixels
    const imgData = drawCtx.getImageData(0, 0, 220, 220);
    let minX = 220, minY = 220, maxX = 0, maxY = 0;
    for (let y = 0; y < 220; y++) {
      for (let x = 0; x < 220; x++) {
        const a = imgData.data[(y * 220 + x) * 4 + 3];
        if (a > 10) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < minX) return null; // nothing drawn

    const pad = 4;
    minX = Math.max(0, minX - pad);
    minY = Math.max(0, minY - pad);
    maxX = Math.min(219, maxX + pad);
    maxY = Math.min(219, maxY + pad);

    const w = maxX - minX + 1;
    const h = maxY - minY + 1;

    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = w;
    tmpCanvas.height = h;
    const tmpCtx = tmpCanvas.getContext('2d');
    tmpCtx.drawImage(drawCanvas, minX, minY, w, h, 0, 0, w, h);

    return tmpCanvas;
  }

  class Snowflake {
    constructor(shapeCanvas) {
      this.shapeCanvas = shapeCanvas;
      this.reset(true);
    }
    reset(init) {
      const baseSize = 10 + Math.random() * 28;
      const aspect = this.shapeCanvas.height / this.shapeCanvas.width;
      this.w = baseSize;
      this.h = baseSize * aspect;
      this.x = Math.random() * snowCanvas.width;
      this.y = init ? -Math.random() * snowCanvas.height * 1.5 : -this.h - Math.random() * 60;
      this.speed = 0.5 + Math.random() * 1.8;
      this.drift = (Math.random() - 0.5) * 0.6;
      this.wobbleAmp = 0.3 + Math.random() * 0.8;
      this.wobbleFreq = 0.01 + Math.random() * 0.02;
      this.phase = Math.random() * Math.PI * 2;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 0.015;
      this.opacity = 0.4 + Math.random() * 0.6;
    }
    update() {
      this.y += this.speed;
      this.x += this.drift + Math.sin(this.phase) * this.wobbleAmp;
      this.phase += this.wobbleFreq;
      this.rotation += this.rotSpeed;

      if (pileHeight) {
        const xi = Math.max(0, Math.min(Math.floor(this.x), pileHeight.length - 1));
        const landY = snowCanvas.height - pileHeight[xi] - this.h / 2;
        if (this.y >= landY) {
          this.settle(xi);
          this.reset(false);
          return;
        }
      } else if (this.y > snowCanvas.height + this.h) {
        this.reset(false);
      }

      if (this.x > snowCanvas.width + this.h) this.x = -this.h;
      if (this.x < -this.h) this.x = snowCanvas.width + this.h;
    }
    settle(xi) {
      const ph = pileHeight[xi];
      const settledY = snowCanvas.height - ph - this.h / 2;
      accCtx.save();
      accCtx.globalAlpha = this.opacity;
      accCtx.translate(this.x, settledY);
      accCtx.rotate(this.rotation);
      accCtx.drawImage(this.shapeCanvas, -this.w / 2, -this.h / 2, this.w, this.h);
      accCtx.restore();

      // Raise pile height around landing column in a bell-curve shape
      const halfW = Math.ceil(this.w / 2) + 2;
      for (let dx = -halfW; dx <= halfW; dx++) {
        const col = xi + dx;
        if (col >= 0 && col < pileHeight.length) {
          const factor = Math.max(0, 1 - Math.abs(dx) / (halfW + 1));
          pileHeight[col] += this.h * 0.45 * factor;
        }
      }
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = this.opacity;
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.drawImage(this.shapeCanvas, -this.w / 2, -this.h / 2, this.w, this.h);
      ctx.restore();
    }
  }

  function animate() {
    ctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
    if (accCtx) ctx.drawImage(accCanvas, 0, 0);
    for (const s of snowflakes) {
      s.update();
      s.draw();
    }
    animId = requestAnimationFrame(animate);
  }

  function startSnow() {
    const shape = captureShape();
    if (!shape) return;

    snowing = true;
    initAccumulation();
    document.getElementById('editor-panel').classList.add('hidden');
    document.getElementById('back-btn').classList.add('visible');

    snowflakes = [];
    const count = Math.min(180, Math.max(60, Math.floor(window.innerWidth / 8)));
    for (let i = 0; i < count; i++) {
      snowflakes.push(new Snowflake(shape));
    }
    animate();
  }

  function stopSnow() {
    snowing = false;
    if (animId) cancelAnimationFrame(animId);
    ctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
    if (accCtx) accCtx.clearRect(0, 0, accCanvas.width, accCanvas.height);
    pileHeight = null;
    snowflakes = [];
    document.getElementById('editor-panel').classList.remove('hidden');
    document.getElementById('back-btn').classList.remove('visible');
  }

  document.getElementById('snow-btn').addEventListener('click', startSnow);
  document.getElementById('back-btn').addEventListener('click', stopSnow);

  // --- PNG Upload ---
  function loadImageToCanvas(img) {
    const maxSize = 200;
    const scale = Math.min(maxSize / img.width, maxSize / img.height);
    const w = img.width * scale;
    const h = img.height * scale;

    // Remove white/near-white background, convert remaining pixels to white
    const tmpC = document.createElement('canvas');
    tmpC.width = img.width;
    tmpC.height = img.height;
    const tmpX = tmpC.getContext('2d');
    tmpX.drawImage(img, 0, 0);
    const imageData = tmpX.getImageData(0, 0, tmpC.width, tmpC.height);
    const d = imageData.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] > 220 && d[i+1] > 220 && d[i+2] > 220) {
        d[i+3] = 0; // transparent
      } else {
        d[i] = 255; d[i+1] = 255; d[i+2] = 255; // white
      }
    }
    tmpX.putImageData(imageData, 0, 0);

    drawCtx.clearRect(0, 0, 220, 220);
    drawCtx.drawImage(tmpC, (220 - w) / 2, (220 - h) / 2, w, h);
    hasDrawn = true;
  }

  document.getElementById('png-btn').addEventListener('click', () => {
    document.getElementById('png-upload').click();
  });

  document.getElementById('png-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => loadImageToCanvas(img);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });
})();
</script>
</body>
</html>
